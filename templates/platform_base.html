<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="csrf-token" content="{{ global_csrf_token() }}">
  <title>{% block title %}Administração Geral | Portaria Control{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='design-system.css') }}">
</head>
<body class="platform-body">
<div class="platform-shell">
<header class="platform-topbar">
  <a class="platform-brand" href="{{ url_for('platform_admin.condominios') }}"><span class="platform-brand-mark">PC</span><span><strong>Portaria Control</strong><small>Control Plane</small></span></a>
  <span class="platform-environment">ADMINISTRAÇÃO DA PLATAFORMA</span>
  <div class="platform-account"><span><strong>{{ session.get("usuario_nome", "Administrador") }}</strong><small>Admin geral</small></span><form method="post" action="{{ url_for('auth.logout') }}"><input type="hidden" name="csrf_token" value="{{ global_csrf_token() }}"><button type="submit">Sair</button></form></div>
</header>
<main class="platform-main">
{% with messages = get_flashed_messages(with_categories=true) %}{% for categoria, msg in messages %}<div class="platform-alert platform-alert-{{ categoria }}" role="alert"><span>{{ msg }}</span></div>{% endfor %}{% endwith %}
{% block content %}{% endblock %}
</main></div></body></html>
