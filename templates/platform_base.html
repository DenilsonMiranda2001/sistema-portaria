<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="csrf-token" content="{{ global_csrf_token() }}">
  <title>{% block title %}Administração Geral | Portaria Control{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="platform-body">
<div class="platform-shell">
  <header class="platform-topbar">
    <a class="platform-brand" href="{{ url_for('platform_admin.condominios') }}">
      <span class="platform-brand-mark">PC</span>
      <span><strong>Portaria Control</strong><small>Administração da plataforma</small></span>
    </a>
    <div class="platform-account">
      <span><strong>{{ session.get("usuario_nome", "Administrador") }}</strong><small>Admin geral</small></span>
      <form method="post" action="{{ url_for('auth.logout') }}">
        <input type="hidden" name="csrf_token" value="{{ global_csrf_token() }}">
        <button type="submit">Sair</button>
      </form>
    </div>
  </header>
  <main class="platform-main">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for categoria, msg in messages %}
        <div class="platform-alert platform-alert-{{ categoria }}" role="alert"><span>{{ msg }}</span></div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</div>
<style>
:root{--p-ink:#172033;--p-muted:#687386;--p-line:#dfe5ee;--p-bg:#f5f7fa;--p-card:#fff}.platform-body{margin:0;background:var(--p-bg);color:var(--p-ink);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.platform-shell{min-height:100vh}.platform-topbar{min-height:68px;background:#fff;border-bottom:1px solid var(--p-line);display:flex;align-items:center;justify-content:space-between;gap:20px;padding:0 max(24px,calc((100vw - 1180px)/2));box-sizing:border-box}.platform-brand,.platform-account{display:flex;align-items:center;gap:11px}.platform-brand{text-decoration:none;color:var(--p-ink)}.platform-brand-mark{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--p-ink);color:#fff;font-size:12px;font-weight:900;letter-spacing:.05em}.platform-brand strong,.platform-brand small,.platform-account strong,.platform-account small{display:block}.platform-brand small,.platform-account small{font-size:11px;color:var(--p-muted);margin-top:2px}.platform-account{text-align:right}.platform-account form{margin:0}.platform-account button{height:36px;border:1px solid var(--p-line);background:#fff;color:var(--p-ink);border-radius:9px;padding:0 14px;font-weight:800;cursor:pointer}.platform-main{max-width:1180px;margin:auto;padding:0 24px;box-sizing:border-box}.platform-alert{margin-top:18px;border:1px solid var(--p-line);background:#fff;border-radius:11px;padding:12px 14px;font-weight:700;font-size:13px}.platform-alert-sucesso{border-color:#bfe3ce;background:#f0faf4;color:#246b43}.platform-alert-erro{border-color:#ebc7cc;background:#fff4f5;color:#8b3440}.platform-alert-aviso{border-color:#ead8a8;background:#fffaf0;color:#795f20}@media(max-width:650px){.platform-topbar{padding:12px 16px}.platform-brand small,.platform-account span{display:none}.platform-main{padding:0 16px}}
</style>
</body>
</html>
