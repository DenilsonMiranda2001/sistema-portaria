{% extends 'base.html' %}{% block title %}Alterar senha{% endblock %}{% block content %}
<section class="pc-module pc-narrow"><header class="pc-pagehead"><div><span class="pc-eyebrow">SEGURANÇA DA CONTA</span><h2>Alterar senha</h2><p>Defina uma nova credencial para {{ user['nome'] }}.</p></div><a class="pc-btn pc-btn-secondary" href="{{ url_for('admin.usuarios') }}">Cancelar</a></header>
<section class="pc-panel pc-account-card"><div class="pc-account-identity"><span class="pc-avatar">{{ user['nome'][:1]|upper }}</span><div><small>USUÁRIO</small><strong>{{ user['nome'] }}</strong><span>@{{ user['usuario'] }}</span></div></div><form method="POST" class="pc-account-form pc-account-form-2"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label class="pc-field"><span>Nova senha</span><input type="password" name="nova_senha" required autocomplete="new-password"></label><label class="pc-field"><span>Confirmar senha</span><input type="password" name="confirmar_senha" required autocomplete="new-password"></label><div class="pc-form-footer"><a class="pc-btn pc-btn-secondary" href="{{ url_for('admin.usuarios') }}">Voltar</a><button type="submit" class="pc-btn pc-btn-primary">Salvar nova senha</button></div></form></section></section>{% endblock %}
