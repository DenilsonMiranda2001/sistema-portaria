<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Alterar Senha</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="page-wrap-sm">

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for cat, msg in messages %}
                    <div class="msg-padrao">{{ msg }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <div class="card-padrao">
            <h2>Alterar senha de {{ user['nome'] }}</h2>

            <form method="POST" class="form-coluna">
                <div class="campo">
                    <label>Nova senha</label>
                    <input class="input-padrao" type="password" name="nova_senha" required>
                </div>

                <div class="campo">
                    <label>Confirmar senha</label>
                    <input class="input-padrao" type="password" name="confirmar_senha" required>
                </div>

                <button type="submit" class="btn-principal">Salvar nova senha</button>
            </form>

            <div class="acoes-topo" style="margin-top:16px;">
                <a class="btn-topo btn-voltar" href="{{ url_for('admin.usuarios') }}">Voltar</a>
                <a class="btn-topo btn-voltar" href="{{ url_for('main.index') }}">Início</a>
            </div>
        </div>
    </div>
</body>
</html>
