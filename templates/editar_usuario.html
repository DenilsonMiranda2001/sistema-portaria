{% extends 'base.html' %}{% block title %}Editar usuário{% endblock %}{% block content %}
<section class="pc-module pc-narrow"><header class="pc-pagehead pc-pagehead-compact"><div><span class="pc-eyebrow">ADMINISTRAÇÃO E ACESSO</span><h2>Editar usuário</h2><p>Atualize identidade e perfil de acesso sem alterar a senha.</p></div><a class="pc-btn pc-btn-secondary" href="{{ url_for('admin.usuarios') }}">Cancelar</a></header>
<section class="pc-panel pc-account-card"><div class="pc-account-identity"><span class="pc-avatar">{{ user['nome'][:1]|upper }}</span><div><small>CONTA</small><strong>{{ user['nome'] }}</strong><span>@{{ user['usuario'] }}</span></div></div><form method="POST" class="pc-account-form"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label class="pc-field"><span>Nome</span><input type="text" name="nome" value="{{ user['nome'] }}" required></label><label class="pc-field"><span>Usuário</span><input type="text" name="usuario" value="{{ user['usuario'] }}" required></label><label class="pc-field"><span>Perfil de acesso</span><select name="tipo"><option value="funcionario" {% if user['tipo'] == 'funcionario' %}selected{% endif %}>Funcionário</option><option value="admin" {% if user['tipo'] == 'admin' %}selected{% endif %}>Admin</option></select></label><div class="pc-form-footer"><a class="pc-btn pc-btn-secondary" href="{{ url_for('admin.usuarios') }}">Voltar</a><button type="submit" class="pc-btn pc-btn-primary">Salvar alterações</button></div></form></section></section>{% endblock %}
