name: quality-gate

on:
  pull_request:
  push:
    branches: [main, hardening/saas-architecture]

jobs:
  static-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Compile Python
        run: python -m compileall -q .
      - name: Secret/runtime hygiene
        run: |
          test ! -f .env
          test -z "$(find . -path './.git' -prune -o -name '*.db' -print)"
          test -z "$(find . -path './.git' -prune -o -type d -name '__pycache__' -print)"
      - name: Production config must fail closed without secret
        env:
          APP_ENV: production
          DATABASE_URL: postgresql://example:example@localhost/example
        run: |
          python - <<'PY'
          from config import Config
          try:
              Config.validate()
          except RuntimeError:
              print("fail-closed config verified")
          else:
              raise SystemExit("production config unexpectedly accepted missing SECRET_KEY")
          PY
